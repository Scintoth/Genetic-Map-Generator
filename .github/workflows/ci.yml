name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Headless smoke run
        run: >
          dotnet artifacts/bin/GeneticMapGenerator.Headless/release/genmap.dll
          --resolution 65 --population 16 --generations 10 --settlement-generations 10
          --snapshot-every 0 --output artifacts/smoke

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-world
          path: artifacts/smoke
